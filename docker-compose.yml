services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3000:3000
      - 3001:3001
    volumes:
      - .:/app
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    networks:
      - ws-network
    restart: always
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    volumes:
      - minio:/data
    command: server --address ":9001" --console-address ":9000" /data
    restart: always
    networks:
      - ws-network
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_USERNAME=redis
      - REDIS_PASSWORD=redispassword
    volumes:
      - redis:/data
    networks:
      - ws-network
  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    environment:
      - RI_ENCRYPTION_KEY=abcdefg
    volumes:
      - redisinsight:/data
    restart: always
    networks:
      - ws-network
volumes:
  minio:
  redis:
  redisinsight:
networks:
  ws-network:
    name: ws-network
    driver: bridge
